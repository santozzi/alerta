# Despliegue en bishop: se publica como https://sergioantozzi.dev/alerta
# (Nginx Proxy Manager -> canal-monitor:8000 por la red proxy-net).
services:
  canal:
    build: .
    container_name: canal-monitor
    restart: unless-stopped
    ports:
      - "8097:8000"
    environment:
      TZ: America/Argentina/Buenos_Aires
      INTERVALO_MIN: "5"
      PREFIJO: /alerta
      URL_PUBLICA: https://sergioantozzi.dev/alerta/
    # Claves privadas (Telegram). Ver .env.example; si no existe el .env, arranca igual.
    env_file:
      - path: .env
        required: false
    volumes:
      - ./datos:/app/datos
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
