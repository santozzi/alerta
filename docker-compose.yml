services:
  canal:
    build: .
    container_name: canal-monitor
    restart: unless-stopped
    ports:
      - "8097:8000"
    environment:
      TZ: America/Argentina/Buenos_Aires
      INTERVALO_MIN: "5"
    # Claves privadas (Telegram). Ver .env.example; si no existe el .env, arranca igual.
    env_file:
      - path: .env
        required: false
    volumes:
      - ./datos:/app/datos
